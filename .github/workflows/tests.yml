name: Tests

# Отдельно от доставки уведомлений: красный тест не должен оставить день
# без плана, поэтому в personal-schedule.yml этого шага нет.

on:
  push:
    paths:
      - '**.py'
      - 'data/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q
