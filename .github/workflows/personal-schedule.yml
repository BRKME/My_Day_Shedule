name: Daily Schedule Notifier
# Расписание управляется VPS-кроном через workflow_dispatch (/opt/myday/dispatch.sh)
# GitHub schedule-кроны удалены из-за дрейфа до 4+ часов (инцидент 06.07.2026: день+день вместо утро+день)

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Период'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - day
          - evening
          - pullups

jobs:
  send-notification:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: Отправка уведомления
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "🚀 Запуск notifier.py с периодом: ${{ inputs.period }}"
          python notifier.py ${{ inputs.period }}
