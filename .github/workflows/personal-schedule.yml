name: Daily Schedule Notifier
on:
  schedule:
    - cron: '0 3 * * *'   # 07:00 MSK — утреннее
    - cron: '0 16 * * *'   # 19:00 MSK — вечернее
  workflow_dispatch:
    inputs:
      period:
        description: 'Период'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  send-notification:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests
      
      - name: Определение периода (ИСПРАВЛЕНО)
        id: period
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            HOUR=$(date -u +%H)
            echo "Текущий час UTC: $HOUR"
            
            # Утро: 04:00-10:00 UTC (07:00-13:00 MSK)
            if [[ "$HOUR" -ge 4 && "$HOUR" -lt 10 ]]; then
              echo "period=morning" >> $GITHUB_OUTPUT
              echo "✅ Определён период: MORNING"
            # Вечер: 16:00-22:00 UTC (19:00-01:00 MSK)
            elif [[ "$HOUR" -ge 16 && "$HOUR" -lt 22 ]]; then
              echo "period=evening" >> $GITHUB_OUTPUT
              echo "✅ Определён период: EVENING"
            else
              # Fallback на вечер (не должно случиться)
              echo "period=evening" >> $GITHUB_OUTPUT
              echo "⚠️ Неожиданный час: $HOUR, используем EVENING"
            fi
          else
            echo "period=${{ inputs.period }}" >> $GITHUB_OUTPUT
            echo "✅ Ручной запуск: ${{ inputs.period }}"
          fi
      
      - name: Отправка уведомления
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 Запуск notifier.py с периодом: ${{ steps.period.outputs.period }}"
          python notifier.py ${{ steps.period.outputs.period }}
